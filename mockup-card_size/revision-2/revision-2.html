<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Card Row Sizing - Revision 2</title>

    <link rel="stylesheet" href="/mockup-card_size/revision-2/revision-2.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"

    <script src="https://cdn.zinggrid.com/zinggrid.min.js" defer></script>
    <script src="/mockup-card_size/revision-2/revision-2.js" defer></script>
</head>

<body>

    <zing-grid caption="Card Resizing Toolbar Demo" layout="card" layout-controls="enabled" viewport-stop

                        <rect x="1" y="2" width="14" height="12" rx="1" stroke="#2196F3" stroke-width="4"

                    </g>

                        </pattern>
                        <pattern id="pattern1_225_3" patternContentUnits="objectBoundingBox" width="1" height="1">
                            <use xlink:href="#image0_225_3"
                                transform="matrix(0.0111111 0 0 0.0185185 -8.54333e-08 -0.333334)" />
                        </pattern>
                        <pattern id="pattern2_225_3" patternContentUnits="objectBoundingBox" width="1" height="1">
                            <use xlink:href="#image0_225_3"
                                transform="matrix(0.0111111 0 0 0.0185185 -8.54333e-08 -0.333334)" />
                        </pattern>
                        <pattern id="pattern3_225_3" patternContentUnits="objectBoundingBox" width="1" height="1">
                            <use xlink:href="#image0_225_3"
                                transform="matrix(0.0111111 0 0 0.0185185 -8.54333e-08 -0.333334)" />
                        </pattern>
                        <clipPath id="clip0_225_3">
                            <rect width="20" height="20" fill="white" />
                        </clipPath>
                        <image id="image0_225_3" width="90" height="90" preserveAspectRatio="none"

                    </defs>
                </svg>



            </button>

            <nav class="card-size-menu" id="cardSizeMenu">
                <h2 class="card-size-title"> Card Scale </h2>

                <!-- Mode Selection -->
                <fieldset class="card-size-mode">
                    <div class="mode-toggle-container">
                        <label class="toggle-switch">
                            <input type="checkbox" id="cardSizeModeToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label" id="toggleLabel">Responsive</span>
                    </div>

                    <!-- Responsive Mode: MIN/MAX-->
                    <fieldset class="card-size-scale" id="minMaxScale">
                        <legend class="sr-only">Card Range</legend>
                        <div class="range-input">

                            <label class="row-field">
                                <span>Min:</span>
                                <input type="number" class="min-input" value="1">
                            </label>

                            <label class="row-field">
                                <span>Max:</span>
                                <input type="number" class="max-input" value="4">
                            </label>

                            <div class="range-slider">
                                <span class="inner-range-slider"></span>


                                <div class="range-slider-input">
                                    <input type="range" class="min-range" min="1" max="6" value="1" step="1">
                                    <input type="range" class="max-range" min="1" max="6" value="4" step="1">
                                </div>
                            </div>

                        </div>

                    </fieldset>

                    <!-- Responsive Mode: XS - XL -->
                    <fieldset class="card-size-scale" id="cardResponsiveScale">
                        <legend class="sr-only">Card Size Scale</legend>

                        <p class="current-size">
                            Current Size: <span id="currentResponsiveSize">M</span>
                        </p>

                        <input type="range" id="cardResponsiveSlider" class="general-slider" min="1" max="5" step="1"
                            value="3">

                        <div class="scale-labels">
                            <span>XS</span>
                            <span>S</span>
                            <span>M</span>
                            <span>L</span>
                            <span>XL</span>
                        </div>
                    </fieldset>

                    <!-- Fixed Scale: 1 - 6 -->
                    <fieldset class="card-size-scale disabled" id="cardFixedScale">
                        <legend class="sr-only">Fixed Scale</legend>

                        <p class="current-size">
                            Cards per Row: <span id="currentFixedSize">4</span>
                        </p>

                        <input type="range" id="cardFixedSlider" class="general-slider" min="1" max="6" step="1"
                            value="4">

                        <div class="scale-labels">
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                        </div>
                    </fieldset>
            </nav>
        </section>


        <!-- Data -->
        <zg-data data='[
            {

            {

            {

                "punchline": "Because it wasn&#39;t peeling well."
            },
            {
                "title": "The Computer Caught a Bug",
                "joke": "Why did the computer go to the doctor?",
                "punchline": "It had a virus."
            },
            {
                "title": "The Calendar&#39;s Countdown",
                "joke": "Why did the calendar get nervous?",
                "punchline": "Because its days were numbered."
            },
            {
                "title": "The Bakery Problem",
                "joke": "Why did the baker stop making donuts?",
                "punchline": "He was fed up with the whole business."
            },
            {

                "joke": "What do you call a dog that&#39;s freezing?",
                "punchline": "A pupsicle."

            {
                "title": "The Musical Fish",
                "joke": "What kind of music do fish like?",

            {

            {

            {
                "title": "The Invisible Man",
                "joke": "What did the invisible man say when he got a job?",

            {

        <zg-colgroup>
            <zg-column index="title"></zg-column>
            <zg-column index="joke"></zg-column>
            <zg-column index="punchline"></zg-column>
        </zg-colgroup>

    </zing-grid>

</body>

</html>
