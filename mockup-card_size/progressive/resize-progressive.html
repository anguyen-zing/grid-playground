<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive</title>
    <link rel="stylesheet" href="/mockup-card_size/progressive/resize-progressive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"
        crossorigin="anonymous">
    <script src="https://cdn.zinggrid.com/zinggrid.min.js" defer></script>
    <script src="/mockup-card_size/progressive/resize-progressive.js" defer></script>
</head>

<body>
    <zing-grid caption="Card Resizing Toolbar Demo - Progressive Buttons" layout="card" layout-controls="enabled">

        <div class="card-size-dropdown" data-tooltip="Card Sizing">
            <button class="card-size-icon" id="cardSizeButton" type="button">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_155_38)">
                        <rect x="9" y="13" width="9" height="5" transform="rotate(180 9 13)" fill="#2196F3" />
                        <rect x="20" y="13" width="9" height="5" transform="rotate(180 20 13)" fill="#2196F3" />
                        <rect x="13" y="20" width="6" height="5" transform="rotate(180 13 20)" fill="#2196F3" />
                        <rect x="20" y="20" width="5" height="5" transform="rotate(180 20 20)" fill="#2196F3" />
                        <rect x="5" y="20" width="5" height="5" transform="rotate(180 5 20)" fill="#2196F3" />
                        <path d="M20 6H0V0H20V6Z" fill="#2196F3" />
                    </g>
                    <defs>
                        <clipPath id="clip0_155_38">
                            <rect width="20" height="20" fill="white" transform="matrix(-1 0 0 -1 20 20)" />
                        </clipPath>
                    </defs>
                </svg>
            </button>

            <div class="card-size-menu" id="cardSizeMenu">

                <h1 class="card-size-title">
                    Card Sizing
                </h1>

                <div class="card-size-scale">

                    <span class="scale-labels">
                        <label>Compact</label>
                        <label>Full</label>
                    </span>

                    <input type="range" id="cardSizeSlider" min="1" max="6" step="1" value="3">

                    <div class="scale-points">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <p class="current-size" id="currentSize">
                        Medium
                    </p>
                </div>
            </div>
        </div>

        <zg-data data='[
            {
                "title": "The Elevator&#39;s Big Promotion",
                "joke": "Why did the elevator get promoted?",
                "punchline": "Because it was always raising the bar!"
            },
            {
                "title": "When Math Gets Overwhelming",
                "joke": "Why was the math book sad?",
                "punchline": "Because it had too many problems."
            },
            {
                "title": "A Fish With Class",
                "joke": "What do you call a fish wearing a bowtie?",
                "punchline": "Sofishticated."
            },
            {
                "title": "Getting Bread-Y for Summer",
                "joke": "Why did the bread go to the gym?",
                "punchline": "Because it wanted to get a little bready for summer."
            },
            {
                "title": "Skeletons Avoiding Conflict",
                "joke": "Why don&#39;t skeletons fight each other?",
                "punchline": "They don&#39;t have the guts."
            },
            {
                "title": "The Coffee Crime",
                "joke": "Why did the coffee file a police report?",
                "punchline": "It got mugged."
            },
            {
                "title": "A Banana in Trouble",
                "joke": "Why did the banana go to the doctor?",
                "punchline": "Because it wasn&#39;t peeling well."
            },
            {
                "title": "The Computer Caught a Bug",
                "joke": "Why did the computer go to the doctor?",
                "punchline": "It had a virus."
            },
            {
                "title": "The Cow With No Legs",
                "joke": "What do you call a cow with no legs?",
                "punchline": "Ground beef."
            },
            {
                "title": "The Calendar&#39;s Countdown",
                "joke": "Why did the calendar get nervous?",
                "punchline": "Because its days were numbered."
            }
        ]'>
        </zg-data>

        <zg-colgroup>
            <zg-column index="title"></zg-column>
            <zg-column index="joke"></zg-column>
            <zg-column index="punchline"></zg-column>
        </zg-colgroup>

    </zing-grid>
</body>

</html>
